<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Log in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-brand">
    <i class="fa-solid fa-bolt"></i>
    <span>TaskFlow</span>
  </div>

  <h1>Welcome back</h1>
  <p class="auth-subtitle">Log in to keep moving on your projects.</p>

  <form id="login-form" class="auth-form" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email">
      <span class="field-error" id="login-email-error"></span>
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
      <span class="field-error" id="login-password-error"></span>
    </div>

    <button type="submit" class="btn btn-primary btn-block">
      <i class="fa-solid fa-right-to-bracket"></i> Log in
    </button>
  </form>

  <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
